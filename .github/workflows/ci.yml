name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore .NET dependencies
        run: dotnet restore Calculator.sln

      - name: Build .NET solution
        run: dotnet build Calculator.sln --configuration Release --no-restore

      - name: Run .NET tests
        run: dotnet test Calculator.sln --configuration Release --no-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: cd src/web/client && npm install

      - name: Build web client
        run: cd src/web/client && npm run build
